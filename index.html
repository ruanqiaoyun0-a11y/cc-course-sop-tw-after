  const chatUI = `
    <div id="dialogueChatArea" style="display:none;">
      <div id="dialogueScenarioBanner" class="dialogue-scenario" style="margin-bottom:16px;"></div>

      <!-- Chat history -->
      <div id="chatHistory" class="chat-history" style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px;max-height:420px;overflow-y:auto;padding:8px;"></div>

      <!-- Round info -->
      <div id="roundInfo" style="display:none;background:#eff6ff;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;">
        <span style="color:#2563eb;font-weight:600;">💬 第 <span id="currentRoundNum">1</span>/${'<span id="totalRounds">3</span>'} 轮</span>
        <span id="roundHint" style="color:#64748b;margin-left:12px;display:none;"></span>
      </div>

      <!-- Current parent message -->
      <div id="currentParentMsg" class="customer-bubble" style="display:none;"></div>

      <!-- Input area -->
      <div id="inputArea" style="display:none;">
        <textarea class="reply-input" id="dialogueInput" placeholder="输入你的回应话术..." style="min-height:100px;" rows="3"></textarea>
        <div class="dialogue-actions" style="margin-top:10px;">
          <button class="btn" id="submitDialogueBtn" onclick="submitDialogueRound()">发送回应 📤</button>
          <button class="btn btn-outline" onclick="resetAllDialogue()">🔄 换个场景</button>

  return `
    <div class="dialogue-container" id="dialogue-container">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <span style="font-size:24px;">🤖</span>
        <h3 style="font-size:16px;font-weight:700;">互动练习：AI模拟对话（多轮）</h3>

// ====== 多轮对话系统状态 ======
let activeScenarioId = null;
let currentRoundIdx = 0;
let roundScores = [];
let chatMessages = [];

// 选择场景
function selectScenario(scenarioId) {
  const quiz = quizzes['quiz4_dialogue'];
  const sc = quiz.scenarios.find(s => s.id === scenarioId);
  if (!sc) return;

  activeScenarioId = scenarioId;
  currentRoundIdx = 0;
  roundScores = [];
  chatMessages = [];

  // Highlight selected card
  document.querySelectorAll('.scenario-card').forEach(card => {
    card.style.borderColor = card.dataset.scenario === scenarioId ? '#4338ca' : '#e2e8f0';
    card.style.background = card.dataset.scenario === scenarioId ? '#eef2ff' : '#fff';
  });

  // Show chat area, hide selector
  document.getElementById('scenarioSelector').style.display = 'none';
  document.getElementById('dialogueChatArea').style.display = 'block';

  // Set scenario banner
  const banner = document.getElementById('dialogueScenarioBanner');
  banner.innerHTML = `<strong>📋 场景：</strong>${sc.scenario}`;

  // Set round count
  const totalRoundsEl = document.getElementById('totalRounds');
  if (totalRoundsEl) totalRoundsEl.textContent = sc.rounds.length;

  // Clear and start first round
  document.getElementById('chatHistory').innerHTML = '';
  document.getElementById('roundFeedback').innerHTML = '';
  document.getElementById('roundFeedback').className = 'ai-feedback-panel';
  document.getElementById('finalSummary').style.display = 'none';

  startRound(0);
}

// 启动某一轮对话
function startRound(roundIdx) {
  const quiz = quizzes['quiz4_dialogue'];
  const sc = quiz.scenarios.find(s => s.id === activeScenarioId);
  if (!sc || roundIdx >= sc.rounds.length) return;

  currentRoundIdx = roundIdx;
  const rd = sc.rounds[roundIdx];

  // Update round info
  document.getElementById('roundInfo').style.display = 'block';
  document.getElementById('currentRoundNum').textContent = roundIdx + 1;
  const hintEl = document.getElementById('roundHint');
  hintEl.style.display = 'inline';
  hintEl.textContent = '💡 ' + rd.hint;

  // Show parent message
  const parentMsgEl = document.getElementById('currentParentMsg');
  parentMsgEl.style.display = 'block';
  parentMsgEl.innerHTML = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span style="font-size:14px;">👨‍👩‍👧</span><strong style="font-size:12px;color:#64748b;">家长</strong></div>${rd.parentMsg}`;

  // Show input area, clear previous feedback
  document.getElementById('inputArea').style.display = 'block';
  document.getElementById('roundFeedback').innerHTML = '';
  document.getElementById('roundFeedback').className = 'ai-feedback-panel';

  const input = document.getElementById('dialogueInput');
  input.value = '';
  input.disabled = false;
  input.focus();

  // Scroll to bottom of chat area
  scrollToChatBottom();
}

// 提交某一轮回应
function submitDialogueRound() {
  const quiz = quizzes['quiz4_dialogue'];
  const sc = quiz.scenarios.find(s => s.id === activeScenarioId);
  if (!sc || currentRoundIdx >= sc.rounds.length) return;

  const rd = sc.rounds[currentRoundIdx];
  const input = document.getElementById('dialogueInput');
  const text = input.value.trim();

  if (!text) {
    showToast('请先输入你的回应内容', 'warning');
    return;
  }

  // Add CC message to chat history
  addChatMessage('cc', text);

  // Score this round using semantic matching (same formula as report writing)
  let totalWeight = 0;
  let totalScore = 0;
  let dimResults = [];

  rd.dimensions.forEach(dim => {
    totalWeight += dim.weight;
    const coverage = semanticMatch(text, dim.terms);
    const dimScore = Math.round(coverage * dim.weight);
    totalScore += dimScore;
    dimResults.push({
      concept: dim.concept,
      score: dimScore,
      maxScore: dim.weight,
      coverage: coverage
    });
  });

  // Normalize to /100 scale
  const roundScoreNorm = Math.round((totalScore / totalWeight) * 100);
  roundScores.push(roundScoreNorm);

  // Show CC bubble in chat with mini-score badge
  addChatBubbleWithScore(text, roundScoreNorm);

  // Build per-round feedback HTML
  let fbHtml = '<div style="padding:16px;background:#f8fafc;border-radius:10px;border-left:4px solid #4338ca;margin-top:12px;">';
  fbHtml += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
    <div class="score-circle ${roundScoreNorm >= 70 ? 'high' : roundScoreNorm >= 50 ? 'medium' : 'low'}" style="width:40px;height:40px;font-size:16px;flex-shrink:0;">${roundScoreNorm}</div>
    <div>
      <div style="font-weight:700;font-size:14px;color:#1e293b;">第${currentRoundIdx+1}轮得分：${roundScoreNorm}/100</div>
      <div style="font-size:11px;color:#64748b;">维度详情 👇</div>
    </div>`;

  fbHtml += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;">';
  dimResults.forEach(d => {
    const pct = d.coverage >= 0.7 ? '✅' : d.coverage >= 0.3 ? '🟡' : '❌';
    fbHtml += `<div style="font-size:12px;padding:4px 8px;background:${d.coverage>=0.5?'#dcfce7':'#fef3c7'};border-radius:6px;">
      <span style="color:#1e293b">${d.concept}</span> 
      <span style="float:right;font-weight:600;color:${d.coverage>=0.5?'#166534':'#92400e'}">${d.score}/${d.maxScore} ${pct}</span>
    </div>`;
  });
  fbHtml += '</div>';

  // Reference answer for this round
  fbHtml += `<details style="margin-top:10px;"><summary style="cursor:pointer;font-size:13px;font-weight:600;color:#2563eb;padding:4px 0;">📖 查看本轮参考答案</summary>
    <div style="margin-top:8px;padding:12px;background:#fff;border-radius:8px;font-size:13px;line-height:1.8;color:#374151;border:1px solid #e2e8f0;">${rd.reference}</div></details>`;

  fbHtml += '</div>';

  const fbEl = document.getElementById('roundFeedback');
  fbEl.innerHTML = fbHtml;
  fbEl.className = 'ai-feedback-panel show';

  // Hide input until user reads feedback
  document.getElementById('inputArea').style.display = 'none';

  // Determine if there's a next round
  if (rd.isFinal) {
    // End conversation - show final summary after a delay
    setTimeout(() => showFinalSummary(sc), 800);
  } else {
    // Show "next round" button - parent will respond based on score quality
    setTimeout(() => showNextRoundButton(rd), 500);
  }

  saveProgress();
}

// 在聊天记录中添加消息
function addChatMessage(role, text) {
  const history = document.getElementById('chatHistory');
  if (role === 'parent') {
    history.innerHTML += `<div class="customer-bubble" style="animation:fadeInUp .3s ease;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span style="font-size:14px;">👨‍👩‍👧</span><strong style="font-size:12px;color:#64748b;">家长</strong></div>
      ${text}
    </div>`;
  } else {
    chatMessages.push({ role: 'cc', text: text });
  }
  scrollToChatBottom();
}

function addChatBubbleWithScore(text, score) {
  const history = document.getElementById('chatHistory');
  const color = score >= 70 ? '#10b981' : score >= 50 ? '#f59e0b' : '#ef4444';
  history.innerHTML += `<div style="background:${score>=70?'#ecfdf5':score>=50?'#fffbeb':'#fef2f2'};border:1px solid ${color};border-radius:12px;padding:12px 14px;margin-left:20px;animation:fadeInUp .3s ease;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:14px;">💼</span><strong style="font-size:12px;color:#64748b;">你（CC）</strong></div>
      <span style="font-size:11px;font-weight:700;color:${color};background:${color}15;padding:2px 8px;border-radius:10px;">${score}分</span>
    </div>
    <div style="font-size:13px;line-height:1.7;color:#374151;">${text.replace(/\n/g, '<br>')}</div>
  </div>`;
  scrollToChatBottom();
}

// 显示「下一轮」按钮，并根据本轮得分决定家长的下一句话
function showNextRoundButton(roundData) {
  const lastScore = roundScores[roundScores.length - 1] || 0;
  const nextParentMsg = lastScore >= 60 ? roundData.nextParentOnGood : roundData.nextParentOnWeak;

  const fbEl = document.getElementById('roundFeedback');

  // Add "continue" button
  fbEl.innerHTML += `
    <div style="margin-top:14px;text-align:center;">
      <button class="btn" onclick="goToNextRound()" style="font-size:14px;padding:10px 28px;">
        继续下一轮 💬
      </button>
      ${lastScore < 60 ? '<div style="margin-top:8px;font-size:12px;color:#f59e0b;">⚠️ 本轮得分偏低，家长会更坚持立场，但你可以尝试挽回来！</div>' : ''}
    </div>`;
}

// 进入下一轮
function goToNextRound() {
  const quiz = quizzes['quiz4_dialogue'];
  const sc = quiz.scenarios.find(s => s.id === activeScenarioId);
  if (!sc) return;

  const nextIdx = currentRoundIdx + 1;
  if (nextIdx >= sc.rounds.length) {
    showFinalSummary(sc);
    return;
  }

  // Get parent's response based on last round score
  const lastRoundData = sc.rounds[currentRoundIdx];
  const lastScore = roundScores[roundScores.length - 1] || 0;
  const parentResponse = lastScore >= 60 ? lastRoundData.nextParentOnGood : lastRoundData.nextParentOnWeak;

  // Add parent response to chat
  addChatMessage('parent', parentResponse);

  // Start next round
  startRound(nextIdx);
}

// 显示最终总结
function showFinalSummary(scenario) {
  const avgScore = roundScores.length > 0
    ? Math.round(roundScores.reduce((a, b) => a + b, 0) / roundScores.length)
    : 0;

  // Update state
  quiz4DialogueAnswered = true;
  quiz4DialogueScore = avgScore;

  // Build full reference dialogue
  let refHtml = '<div style="margin-top:16px;padding:16px;background:#eff6ff;border-radius:10px;border:2px solid #93c5fd;">';
  refHtml += '<div style="font-weight:700;color:#1e40af;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:6px;">📖 完整参考对话</div>';

  scenario.rounds.forEach((rd, i) => {
    refHtml += `<div style="margin-bottom:14px;${i < scenario.rounds.length-1 ? 'padding-bottom:14px;border-bottom:1px dashed #bfdbfe;' : ''}">

      <div style="font-size:13px;line-height:1.7;color:#374151;">
        <div style="margin:6px 0;padding:8px 12px;background:#fef3c7;border-radius:8px;"><strong style="color:#92400e;">👨‍👩‍👧 家长：</strong>${rd.parentMsg}</div>

    </div>`;
  });

  const summaryEl = document.getElementById('finalSummary');
  const passed = avgScore >= 60;

  summaryEl.innerHTML = `
    <div style="padding:24px;background:linear-gradient(135deg,#667eea76,#764ba276);border-radius:14px;text-align:center;margin-top:16px;">

      <div class="score-circle ${avgScore >= 70 ? 'high' : avgScore >= 50 ? 'medium' : 'low'}" style="width:72px;height:72px;font-size:28px;margin:0 auto 12px;">${avgScore}</div>
      <div style="font-size:16px;font-weight:700;color:#1e293b;">对话练习完成！</div>
      <div style="font-size:13px;color:#475569;">综合平均得分：${avgScore}/100 · 共${roundScores.length}轮 · ${passed ? '✅ 通过' : '❌ 未通过（需≥60分）'}</div>

      <div style="margin-top:16px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;">
        ${roundScores.map((s, i) => `
          <div style="padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;background:${s>=70?'#dcfce7':s>=50?'#fef3c7':'#fee2e2'};color:${s>=70?'#166534':s>=50?'#92400e':'#991b1b'};">
            第${i+1}轮：${s}分
          </div>
        `).join('')}
      </div>
    </div>
    ${refHtml}
    <div style="margin-top:14px;text-align:center;">
      <button class="btn btn-outline" onclick="resetAllDialogue()">🔄 换个场景再试</button>
    </div>
  `;
  summaryEl.style.display = 'block';

  // Hide input area
  document.getElementById('inputArea').style.display = 'none';
  document.getElementById('currentParentMsg').style.display = 'none';

// AI API 配置（小米 MiMo — 终极考核专用，密钥构建时注入）
// Key 在构建时由 _build.js 以 hex 混淆形式注入，运行时还原
// ============================================================
const _HEX2 = '736b2d637765776465737462366a6437697a646b3035336d376f327a3572613134386e6e6767616c31386b757631376f303167';   // 占位符，_build.js 构建时替换为 hex 混淆 key
function _rK2() {
  // 安全保护：未注入（仍是占位符）时返回空，避免把占位符当 key 发出去
  if (!_HEX2 || _HEX2.indexOf('__') === 0) return '';
  let o = '';
  for (let i = 0; i < _HEX2.length; i += 2) o += String.fromCharCode(parseInt(_HEX2.substr(i, 2), 16));
  return o;
}
const MIMO_API_URL = 'https://api.xiaomimimo.com/v1/chat/completions';
const MIMO_MODEL = 'mimo-v2.5-pro';

// OpenAI 兼容客户端（轻量 fetch 封装，模拟 client.chat.completions.create）
function createOpenAIClient({ apiKey, baseURL }) {
  return {
    chat: {
      completions: {
        async create(body, timeoutMs = 25000) {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), timeoutMs);
          try {
            const payload = {
              ...body,
              model: body.model || MIMO_MODEL,
              // mimo-v2.5-pro 需关闭 thinking 才能自定义 temperature；max_tokens 参数名映射
              thinking: { type: 'disabled' },
              max_completion_tokens: body.max_completion_tokens || body.max_tokens || 500
            };
            delete payload.max_tokens;
            const response = await fetch(baseURL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + apiKey
              },
              body: JSON.stringify(payload),
              signal: ctrl.signal
            });
            if (!response.ok) {
              const errText = await response.text();
              let errMsg = 'AI 服务暂时不可用 (' + response.status + ')';
              try { const j = JSON.parse(errText); errMsg = j.error?.message || j.message || errMsg; } catch(e) {}
              throw new Error(errMsg);
            }
            return await response.json();
          } catch (err) {
            if (err.name === 'AbortError') throw new Error('AI 回应超时，请重试');
            throw err;
          } finally {
            clearTimeout(timer);
          }
        }
      }
    }
  };
}
const mimoClient = createOpenAIClient({ apiKey: _rK2(), baseURL: MIMO_API_URL });
async function callMiMo(body, timeoutMs) { return mimoClient.chat.completions.create(body, timeoutMs); }

// MiMo 健康检查（TTL 缓存）
let mimoAvailable = null;
let mimoCheckedAt = 0;
async function checkMiMoHealth() {
  const ttl = mimoAvailable ? 5 * 60 * 1000 : 30 * 1000;
  if (mimoAvailable !== null && Date.now() - mimoCheckedAt < ttl) return mimoAvailable;
  try {
    const data = await callMiMo({ model: MIMO_MODEL, messages: [{ role: 'user', content: 'ping' }], max_tokens: 1, temperature: 0 }, 15000);
    mimoAvailable = !!(data && data.choices);
  } catch (e) {
    console.warn('MiMo 健康检查失败:', e.message);
    mimoAvailable = false;
  }
  mimoCheckedAt = Date.now();
  return mimoAvailable;
}

// 发送消息并获取 AI 家长回复
// ============================================================
async function submitFinalMessage() {
  if (finalSubmitted || finalPendingCall) return;
  const quiz = quizzes['quiz6_final'];
  const input = document.getElementById('finalDialogueInput');
  const text = (input.value || '').trim();
  if (!text) { showToast('请先输入回应话术', 'warning'); return; }
  if (text.length < 4) { showToast('回应至少4个字', 'warning'); return; }

  if (!_checkFinalRateLimit()) {
    showToast('本小时练习次数已达上限，请稍后再试', 'warning');
    return;
  }

  addFinalMessage('user', text);
  finalConversation.push({ role: 'user', content: text });
  finalExchangeCount++;
  document.getElementById('finalExchangeCount').textContent = finalExchangeCount;

  const topicIdx = inferFinalTopic(text);
  if (topicIdx >= 0) updateFinalTopicHighlight(topicIdx);

  input.value = '';
  input.disabled = true;
  document.getElementById('finalSubmitDialogueBtn').disabled = true;
  document.getElementById('finalTypingIndicator').style.display = 'block';
  finalPendingCall = true;

  try {
    const messages = [
      { role: 'system', content: quiz.parentSystemPrompt },
      ...finalConversation.slice(-12).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content })),
      { role: 'user', content: text }
    ];

    const data = await callMiMo({
      messages: messages,
      max_tokens: 120,
      temperature: 0.3
    });

    const parentReply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content ? data.choices[0].message.content : '').trim() || '（家长未回应，请继续）';

    addFinalMessage('parent', parentReply);
    finalConversation.push({ role: 'parent', content: parentReply });
    finalExchangeCount++;
    document.getElementById('finalExchangeCount').textContent = finalExchangeCount;

    if (finalExchangeCount >= 6) {
      document.getElementById('finalEndBtn').style.display = 'inline-block';
    }
  } catch (err) {
    console.error('AI 家长调用失败:', err);
    showToast('⚠️ AI 家长回应失败：' + (err.message || '未知错误') + '，请重试', 'warning');
    finalExchangeCount--;
    document.getElementById('finalExchangeCount').textContent = finalExchangeCount;
  } finally {
    finalPendingCall = false;
    document.getElementById('finalTypingIndicator').style.display = 'none';
    input.disabled = false;
    document.getElementById('finalSubmitDialogueBtn').disabled = false;
    input.focus();
  }
}

// ============================================================
// AI 综合评分
// ============================================================
async function evaluateFinalWithAI() {
  const quiz = quizzes['quiz6_final'];

  const conversationText = finalConversation.map(m =>
    (m.role === 'user' ? '🧑‍💼 CC' : '👩 家长') + '：' + m.content
  ).join('\n');

  const evalMessages = [
    { role: 'system', content: quiz.evaluatorSystemPrompt },
    { role: 'user', content: '以下是 CC 学员的课后电话对话记录，请进行综合评分：\n\n' + conversationText + '\n\n共 ' + finalExchangeCount + ' 轮对话（家长 + CC 合计）。' }
  ];

  const data = await callMiMo({
    messages: evalMessages,
    max_tokens: 500,
    temperature: 0.3,
    response_format: { type: 'json_object' }
  });

  const rawText = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content ? data.choices[0].message.content : '').trim();

  let result;
  try {
    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    result = JSON.parse(jsonMatch ? jsonMatch[0] : rawText);
  } catch (e) {
    console.warn('AI 评分 JSON 解析失败，原始返回:', rawText);
    // 解析失败不计成绩，由调用方恢复界面并允许重新提交评分
    throw new Error('评分服务返回了无法解析的结果，请重新提交评分');
  }

  finalScore = Math.min(Math.max(parseInt(result.score) || 0, 0), 100);
  finalTaskSubmitted = true;
  showToast('终极考核已完成，得分：' + finalScore + '分', finalScore >= 60 ? 'success' : 'warning');

  renderFinalScoreFeedback(result);
  saveProgress();
  updateSidebarLocks();
  checkCertificate();
}

  showToast('终极考核已重置，可以重新开始', 'success');
}

// ============================================================
// Ctrl+Enter 快捷键（最终考核输入框）
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'Enter') {
    const input = document.getElementById('finalDialogueInput');
    if (input && document.activeElement === input && !finalSubmitted && !finalPendingCall) {
      e.preventDefault();
      submitFinalMessage();
    }
  }
});


function restoreAllUIState() {
  restoreQuizUI();
  restoreReportWritingUI();
  navigateTo(currentSection);
  checkCertificate();
}

function restoreQuizUI() {
  courseData.sections.forEach((_, chIdx) => {
    chapterQuizArr(chIdx).forEach((q) => {
      const st = quizState[q.id];
      const quizCard = document.getElementById('quiz-' + q.id);
      if (!quizCard) return;
      const options = quizCard.querySelectorAll('.quiz-option');
      const feedbackEl = document.getElementById('feedback-' + q.id);

      if (st && st.solved) {
        options.forEach((opt, i) => {
          opt.style.pointerEvents = 'none';
          if (i === q.correct) opt.classList.add('correct');
        });
        if (feedbackEl) {
          feedbackEl.innerHTML = buildExplainHTML(q, true);
          feedbackEl.className = 'quiz-feedback correct show';
        }
        quizCard.classList.add('answered-correct');
      } else if (st && st.selected >= 0) {
        // 答错过但未答对：恢复红项，其余选项可继续重试
        if (st.selected !== q.correct && options[st.selected]) {
          options[st.selected].classList.add('wrong');
          options[st.selected].style.pointerEvents = 'none';
        }
        quizCard.classList.add('answered-wrong');
        if (feedbackEl) {
          feedbackEl.innerHTML = buildExplainHTML(q, false);
          feedbackEl.className = 'quiz-feedback wrong show';
        }
      }
    });
    updateChapterProgressUI(chIdx);
  });
}

function restoreReportWritingUI() {
  if (!reportWritingSubmitted) return;

  const btn = document.getElementById('reportWritingBtn');
  if (btn) {
    btn.textContent = '重新提交 🔄';
  }

  const input = document.getElementById('reportWritingInput');
  if (input && reportWritingText) {
    input.value = reportWritingText;
    const counter = document.getElementById('reportWritingCount');
    if (counter) counter.textContent = reportWritingText.length;
  }

  const feedbackEl = document.getElementById('reportWritingFeedback');
  if (feedbackEl && reportWritingFeedbackHTML) {
    feedbackEl.innerHTML = reportWritingFeedbackHTML;
    feedbackEl.classList.add('show');
  }

  if (reportWritingScore < 60) {
    const warnEl = document.getElementById('reportWritingScoreWarning');
    if (warnEl) {
      warnEl.innerHTML = '<div style="margin-top:12px;padding:12px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:13px;line-height:1.7;">' +
        '<strong style="color:#dc2626;">⚠️ 得分未达60分，第2章尚未解锁。</strong><br>' +
        '<span style="color:#64748b;">请参考上方评分回馈和满分参考答案，修改后重新提交。每个维度达到2颗星以上方可解锁下一章。</span></div>';
      warnEl.style.display = 'block';
    }
  }
}

function getStars(score) {
  const full = Math.round(score / 20);
  let s = '';
  for (let i = 0; i < 5; i++) {
    s += i < full ? '★' : '☆';
  }
  return s;
}

function setupQuizListeners() {
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      const dialogueInput = document.getElementById('dialogueInput');
      if (dialogueInput && document.activeElement === dialogueInput) submitDialogueRound();
    }
  });
}

function startTimer() {
  const saved = localStorage.getItem(LS_PREFIX + '_study_seconds');
  if (saved) studySeconds = parseInt(saved);
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    studySeconds++;
    updateTimerDisplay();
    if (studySeconds % 10 === 0) localStorage.setItem(LS_PREFIX + '_study_seconds', studySeconds);
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(studySeconds / 60);
  const secs = studySeconds % 60;
  const timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = timeStr;
  const mhTimer = document.getElementById('mhTimer');
  if (mhTimer) mhTimer.textContent = '⏱ ' + timeStr;
}

function toggleNotes() {
  document.getElementById('notesPanel').classList.toggle('open');
}
function updateNotesForSection(index) {
  document.getElementById('notesChapterLabel').textContent = courseData.sections[index].title;
  const saved = JSON.parse(localStorage.getItem(LS_PREFIX + '_notes') || '{}');
  document.getElementById('notesTextarea').value = saved[index] || '';
}
function loadNotes() {
  const saved = JSON.parse(localStorage.getItem(LS_PREFIX + '_notes') || '{}');
  const ta = document.getElementById('notesTextarea');
  if (ta) {
    ta.value = saved[currentSection] || '';
    ta.addEventListener('input', function() {
      const all = JSON.parse(localStorage.getItem(LS_PREFIX + '_notes') || '{}');
      all[currentSection] = this.value;
      localStorage.setItem(LS_PREFIX + '_notes', JSON.stringify(all));
    });
  }
}

function saveProgress() {
  const state = {
    currentSection,
    completedSections: [...completedSections],
    quizState,
    reportWritingSubmitted, reportWritingScore, reportWritingText, reportWritingFeedbackHTML,
    quiz4DialogueAnswered, quiz4DialogueScore,
    finalTaskSubmitted, finalScore,
    activeScenarioId, currentRoundIdx, roundScores
  };
  localStorage.setItem(LS_PREFIX + '_progress', JSON.stringify(state));
}
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_PREFIX + '_progress'));
    if (saved) {
      completedSections = new Set(saved.completedSections || []);
      if (saved.quizState && typeof saved.quizState === 'object') {
        quizState = sanitizeQuizState(saved.quizState);
      } else {
        quizState = migrateLegacyProgress(saved);
      }
      reportWritingSubmitted = saved.reportWritingSubmitted || false;
      reportWritingScore = saved.reportWritingScore || 0;
      reportWritingText = saved.reportWritingText || '';
      reportWritingFeedbackHTML = saved.reportWritingFeedbackHTML || '';
      quiz4DialogueAnswered = saved.quiz4DialogueAnswered || false;
      quiz4DialogueScore = saved.quiz4DialogueScore || 0;
      if (saved.activeScenarioId) activeScenarioId = saved.activeScenarioId;
      if (saved.currentRoundIdx) currentRoundIdx = saved.currentRoundIdx;
      if (saved.roundScores && saved.roundScores.length > 0) roundScores = saved.roundScores;
      finalTaskSubmitted = saved.finalTaskSubmitted || false;
      finalScore = saved.finalScore || 0;
      if (saved.currentSection !== undefined && saved.currentSection !== null) {
        currentSection = saved.currentSection;
      }
      updateProgress();
      updateSidebarLocks();
    }
  } catch (e) {}
}
function migrateLegacyProgress(saved) {
  // 旧结构（quiz1-5 各1题）→ 新结构：旧答对迁为每章第1题 solved；答错不迁（新机制可重试）
  const state = {};
  for (let ch = 1; ch <= 5; ch++) {
    if (!saved['quiz' + ch + 'Answered']) continue;
    const sel = saved['quiz' + ch + 'Selected'];
    const q = (chapterQuizzes['ch' + ch] || [])[0];
    if (!q) continue;
    if (sel === q.correct) state[q.id] = { selected: sel, solved: true, wrongTries: 0 };
  }
  return state;
}
function sanitizeQuizState(raw) {
  const state = {};
  Object.keys(raw || {}).forEach(id => {
    const q = findQuizItemById(id);
    if (!q) return;
    const st = raw[id] || {};
    const sel = parseInt(st.selected, 10);
    const fixed = {
      selected: (sel >= 0 && sel < q.options.length) ? sel : -1,
      solved: !!st.solved,
      wrongTries: parseInt(st.wrongTries, 10) || 0
    };
    if (fixed.solved) fixed.selected = q.correct;
    state[id] = fixed;
  });
  return state;
}

function checkCertificate() {
  const allDone = completedSections.size >= courseData.sections.length
    && allChaptersSolved()
    && reportWritingSubmitted && reportWritingScore >= 60
    && quiz4DialogueAnswered && quiz4DialogueScore >= 60
    && finalTaskSubmitted && finalScore >= 60;
  if (allDone) {
    setTimeout(() => {
      showToast('🏆 恭喜完成全部课程！点击领取结业证书', 'success');
      document.getElementById('certStudentName').textContent = '请填写姓名';
      document.getElementById('certScore').textContent = '综合评定：通过（' + finalScore + '分）';
      document.getElementById('certDate').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('certOverlay').classList.add('show');
    }, 1000);
  }
}

function closeCertificate() {
  document.getElementById('certOverlay').classList.remove('show');
}
function printCertificate() {
  const cert = document.getElementById('certPaper');
  const win = window.open('', '_blank', 'width=750,height=600');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>结业证书</title><style>');
  win.document.write('body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f1f5f9;padding:20px;}');
  win.document.write('.cert{background:#fff;max-width:600px;width:100%;padding:48px 36px;text-align:center;border:2px solid #e2e8f0;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,0.15);}');
  win.document.write('.cert h1{font-size:28px;color:#1d4ed8;margin-bottom:4px;font-weight:800;}');
  win.document.write('.cert .sub{font-size:12px;color:#64748b;letter-spacing:0.1em;margin-bottom:24px;}');
  win.document.write('.cert .body{font-size:15px;line-height:2;color:#1e293b;}');
  win.document.write('.cert .name{display:inline-block;border-bottom:2px solid #2563eb;min-width:120px;padding:4px 12px;margin:0 4px;}');
  win.document.write('.cert .course{font-weight:700;color:#1d4ed8;margin:8px 0;}');
  win.document.write('.cert .score{margin:20px 0;font-size:16px;font-weight:600;color:#10b981;}');
  win.document.write('.cert .footer{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-top:32px;border-top:1px solid #e2e8f0;padding-top:16px;}');
  win.document.write('</style></head><body><div class="cert">');
  win.document.write(cert.innerHTML.replace(/<button[^>]*>.*?<\/button>/g, ''));
  win.document.write('</div></body></html>');
  win.document.close();
  setTimeout(() => win.print(), 500);
}

function showToast(msg, type) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

document.addEventListener('DOMContentLoaded', init);
